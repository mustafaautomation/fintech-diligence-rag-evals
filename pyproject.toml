[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-diligence-rag-evals"
version = "0.1.0"
description = "Synthetic fintech due-diligence RAG assistant with a RAGAS evaluation gate."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Muhammad Mustafa" }]
keywords = ["rag", "ragas", "llm-evaluation", "fintech"]
dependencies = [
    "ragas==0.4.3",
    "langchain==0.3.27",
    "langchain-core==0.3.81",
    "langchain-community==0.3.27",
    "langchain-openai==0.3.35",
    "rapidfuzz>=3.12",
    "numpy>=1.26,<3",
    "faiss-cpu>=1.8",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "openai>=1.40",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
diligence = "fintech_diligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
packages = ["fintech_diligence"]
mypy_path = "src"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]
